spec:
  handler: main:handler
  runtime: python:3.10
  image: cvat.pth.spinetrack.spinepose:latest
  description: Spine pose estimation from full-body tracking for biomechanical dance analysis
  resources:
    requests:
      cpu: "25m"
      memory: "1Mi"
  build:
    image: cvat.pth.spinetrack.spinepose
    baseImage: pytorch/pytorch:2.0.1-cuda11.7-cudnn8-runtime
    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0 libxcb1 libx11-6 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install spinepose opencv-python-headless numpy
  platform:
    attributes:
      network: cvat_cvat