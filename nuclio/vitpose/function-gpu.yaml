spec:
  description: ViTPose++ wholebody with 133 keypoints
  handler: main:handler
  runtime: python:3.10
  platform:
    attributes:
      network: cvat_cvat
  build:
    image: cvat.pth.vitpose.plus.plus.wholebody
    baseImage: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
    directives:
      preCopy:
        - kind: RUN
          value: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libgl1-mesa-glx libglib2.0-0 git build-essential && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install --no-cache-dir setuptools==69.5.1 timm==0.4.9 einops opencv-python-headless "numpy<2"
        - kind: RUN
          value: |
            git clone https://github.com/open-mmlab/mmcv.git /opt/nuclio/mmcv && \
            cd /opt/nuclio/mmcv && git checkout v1.3.9 && \
            MMCV_WITH_OPS=1 pip install -e .
        - kind: RUN
          value: |
            git clone https://github.com/ViTAE-Transformer/ViTPose.git /opt/nuclio/ViTPose && \
            cd /opt/nuclio/ViTPose && pip install -v -e .
      postCopy:
        - kind: RUN
          value: pip install "numpy<2"
  triggers:
    myHttpTrigger:
      kind: http
      maxWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  platform:
    attributes:
      network: cvat_cvat
      restartPolicy:
        name: always
        maximumRetryCount: 3
